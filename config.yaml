# ================================================================
# 바이낸스 USDT-M 무기한 선물 페이퍼 트레이딩 봇 설정 (롱/숏)
# 시크릿(슬랙 토큰/채널)은 절대 여기에 쓰지 말 것 → .env 전용
# ================================================================

# ── 모드 ──────────────────────────────────────────────────────
# paper | live. 기본 paper. live 는 미구현이며 호출 시 RuntimeError 로 차단된다.
mode: paper
exchange: binance_futures      # 바이낸스 USDT-M 무기한 선물

# ── 거래 대상 (USDT-M 무기한 심볼) ────────────────────────────
symbols:
- BTCUSDT
- ETHUSDT
- SOLUSDT
- XRPUSDT

# ── 시세 수집 ─────────────────────────────────────────────────
market_data:
  poll_interval_sec: 60        # 메인 루프 주기 (초)
  candle_interval: "1h"        # 1m,3m,5m,15m,30m,1h,2h,4h,6h,8h,12h,1d,3d,1w
                               # always-in 휩쏘/수수료 누수 줄이려 15m→1h (하루 수 회 전환)
  candle_count: 200            # 지표 계산용 캔들 수집 개수
  request_interval_sec: 0.2    # 요청 간 간격 (레이트리밋 대응)
  max_consecutive_failures: 5  # 연속 실패 N회 시 경고/슬랙 알림

# ── 계정 / 페이퍼 선물 엔진 ───────────────────────────────────
account:
  initial_balance_usdt: 1000.0      # 시작 가상자본 (USDT) — 약 140만원. config 한 줄로 변경 가능
  taker_fee_rate: 0.0005            # 시장가 체결 수수료 0.05% (바이낸스 선물 taker ≈0.04%, 보수적)
  maker_fee_rate: 0.0002            # 지정가 (참고용)
  slippage_bp: 1.0                  # 슬리피지 베이시스 포인트 (1bp = 0.01%; 0 = 비활성)
  min_notional_usdt: 5.0            # 최소 주문 명목가치 (바이낸스 선물 정책)
  margin_mode: isolated             # isolated (격리) — 포지션별 증거금/청산
  maintenance_margin_rate: 0.005    # 유지증거금률 0.5% (간이; 청산가 계산용)
  funding_enabled: false            # 펀딩비 모델링 (기본 off; 백테스트 일관성 위해)

# ── 레버리지 ──────────────────────────────────────────────────
leverage:
  default: 3                   # 기본 레버리지
  max: 10                      # 최대 허용 (초과 요청 시 max 로 제한)

# ── 전략 선택 & 파라미터 (롱/숏 대칭) ─────────────────────────
# 기본값: ma_trend (always-in) — 매 틱 단기/장기 MA로 항상 롱 또는 숏 유지(HOLD 없음).
#   추세 역전 시 청산 후 반대 전환. 15분봉이라 하루에 여러 번 전환·거래 발생.
#   ⚠️ 전환이 잦아 수수료 누적·횡보 휩쏘 위험. 일봉 ma_crossover 보다 공격적.
strategy: ma_trend
strategy_params:
  ma_trend:
    short: 10
    long: 30
  volatility_breakout:
    k: 0.5                     # 변동폭 계수 (상방 돌파=롱 / 하방 돌파=숏)
  ma_crossover:
    short: 5                   # 골든크로스=롱 / 데드크로스=숏 (교차 순간만)
    long: 15
  rsi_mean_reversion:
    period: 14
    oversold: 30               # 과매도=롱
    overbought: 70             # 과매수=숏

# ── 리스크 관리 ───────────────────────────────────────────────
risk:
  position_size_pct: 20.0           # 1회 진입 증거금 = 가용잔고의 %
  stop_loss_pct: 3.0                # 손절선 (진입가 대비 불리 방향 %, 방향 자동 반영)
  take_profit_pct: 5.0              # 익절선 (진입가 대비 유리 방향 %; 0 = 비활성)
  max_daily_loss_pct: 5.0           # 일일 최대 손실한도 (초과 시 당일 신규진입 중단, %)
  max_position_pct_per_symbol: 40.0 # 심볼당 최대 명목 비중 (전체 자산 대비 %)
  allow_long: true
  allow_short: true                 # 숏 허용

# ── 슬랙 알림 ─────────────────────────────────────────────────
slack:
  enabled: true                # 전체 알림 on/off (토큰 미설정 시 자동 무력화)
  events:
    on_open: true              # 포지션 진입 (롱/숏)
    on_close: true             # 포지션 청산 (실현손익 포함)
    on_stop_loss: true
    on_take_profit: true
    on_liquidation: true       # 강제청산
    on_daily_loss_limit: true
    on_bot_start: true
    on_bot_stop: true
    on_error: true
    on_daily_summary: true
  retry_max: 3
  retry_delay_sec: 5

# ── 웹 대시보드 ───────────────────────────────────────────────
dashboard:
  host: "127.0.0.1"            # 로컬 전용. 외부 노출 시 "0.0.0.0"
  port: 8000
  poll_interval_ms: 5000

# ── 저장소 ────────────────────────────────────────────────────
storage:
  db_path: "data/paper_bot.db"

# ── 백테스트 ──────────────────────────────────────────────────
backtest:
  days: 60                     # 과거 데이터 수집 기간 (일). 15분봉 기준 약 5,760봉
  initial_balance_usdt: 1000.0

# ── 파라미터 최적화 (그리드 서치) ─────────────────────────────
optimize:
  split_ratio: 0.7             # 인샘플/아웃샘플 시계열 분할 비율
  score_weights:
    sharpe: 0.5
    total_return: 0.3
    mdd: 0.2
  leverage_grid: [2, 3, 5]     # 레버리지도 탐색
  param_grid:
    ma_trend:
      short: [3, 5, 7, 10]
      long: [15, 20, 30, 50]
    volatility_breakout:
      k: [0.3, 0.4, 0.5, 0.6, 0.7, 0.8, 1.0]
    ma_crossover:
      short: [3, 5, 7, 10]
      long: [15, 20, 30, 50]
    rsi_mean_reversion:
      period: [7, 10, 14, 21]
      oversold: [20, 25, 30]
      overbought: [70, 75, 80]
